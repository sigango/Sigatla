name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly, to catch breaking releases of PyMuPDF or the Anthropic SDK, which are not pinned.
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }}, Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.14"]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip list | grep -i -E "pymupdf|anthropic"

      - name: Tests
        run: python -m pytest -q

      - name: Build the demo
        working-directory: examples/demo
        run: |
          sigatla extract
          sigatla check
          sigatla pack saliency-l1 --part 1
          test -s build/saliency-l1/READING_PACK.md
          sigatla build
          test -s site/index.html
          sigatla next
