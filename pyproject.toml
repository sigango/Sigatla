[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sigatla"
version = "0.1.0"
description = "Turn papers and lecture slides into an interactive 3D map of notes written by your AI assistant."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
  "pymupdf>=1.24",
  "anthropic>=1.0",
]

[project.scripts]
sigatla = "sigatla.cli:main"

[tool.setuptools]
packages = ["sigatla"]

[tool.setuptools.package-data]
sigatla = ["web/*.html"]
