[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sigatla"
version = "0.1.0"
description = "Turn papers and lecture slides into an interactive 3D map of notes written by your AI assistant."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
  "pymupdf>=1.24",
  "anthropic>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/sigango/Sigatla"
Issues = "https://github.com/sigango/Sigatla/issues"

[project.scripts]
sigatla = "sigatla.cli:main"

[tool.setuptools]
packages = ["sigatla", "sigatla.web"]

[tool.setuptools.package-data]
"sigatla.web" = ["*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
