<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sigatla</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@400;500;600&family=Orbitron:wght@600;700&family=Public+Sans:ital,wght@0,400;0,600;1,400&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* Layout: observatory. A full-bleed 3D field; a thin instrument bar on top; a reading panel
   docks right on desktop (the field narrows so the focus stays centred) and rises as a sheet on phones.
   Three backgrounds: night (default), paper, high contrast — chosen in the view popover.
   Source colors are set from the data as --g-<group id> on :root (see applyGroupColors). */
:root{
  --bg:#070a12; --bg-2:#0c1120; --panel:#10162a; --panel-2:#161e36; --line:#222b44; --line-2:#33405f;
  --fg:#e8ebf3; --muted:#9aa4bb; --faint:#68738c; --strong:#ffffff; --accent:#efe6cf; --link:#8fc6ff;
  --stage:radial-gradient(120% 95% at 50% 38%, #0e1636 0%, #070b1c 46%, #03050c 100%);
  --r-evidence:#5fe08a; --r-tension:#ff5c93; --r-method:#5aa9ff; --r-context:#f3d36b; --r-structure:#a3acc2;
  --link-rest:rgba(150,166,205,.26); --link-faint:rgba(150,166,205,.11); --link-dim:rgba(150,166,205,.035);
  --lbl-bg:rgba(9,13,26,.76); --lbl-line:rgba(255,255,255,.10); --lbl-fg:#eef0f6;
  --primary-bg:#efe6cf; --primary-fg:#14161c; --tip-bg:rgba(16,22,42,.97);
  --emissive:.22; --dim:.13; --halo:1;
  /* Orbitron (Latin only): the wordmark. Space Grotesk: titles, planet names, menus and small labels.
     Inter: interface text. Public Sans: long notes. DM Mono (no Vietnamese glyphs): numbers and code only. */
  --f-brand:"Orbitron", "Space Grotesk", sans-serif;
  --f-display:"Space Grotesk", "Inter", system-ui, sans-serif;
  --f-label:"Space Grotesk", "Inter", system-ui, sans-serif;
  --f-body:"Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-read:"Public Sans", "Inter", system-ui, sans-serif;
  --f-mono:"DM Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --panel-w:min(470px, 42vw);
  color-scheme:dark;
}
:root[data-bg="paper"]{
  --bg:#f3f0e8; --bg-2:#faf8f3; --panel:#fffdf8; --panel-2:#f2eee4; --line:#e1dace; --line-2:#cbc1ae;
  --fg:#1d2130; --muted:#565c6e; --faint:#878c9a; --strong:#0d0f17; --accent:#8a6420; --link:#1f6fd1;
  --stage:radial-gradient(120% 95% at 50% 38%, #fffefa 0%, #f3f0e8 55%, #e4ddcd 100%);
  --r-evidence:#1b9a4a; --r-tension:#d41f5b; --r-method:#1f6fd1; --r-context:#a87600; --r-structure:#7c8498;
  --link-rest:rgba(55,62,82,.28); --link-faint:rgba(55,62,82,.13); --link-dim:rgba(55,62,82,.05);
  --lbl-bg:rgba(255,253,248,.9); --lbl-line:rgba(30,35,50,.14); --lbl-fg:#1d2130;
  --primary-bg:#1d2130; --primary-fg:#fffdf8; --tip-bg:rgba(255,253,248,.98);
  --emissive:.05; --dim:.17; --halo:0;
  color-scheme:light;
}
:root[data-bg="contrast"]{
  --bg:#000; --bg-2:#050505; --panel:#0a0a0a; --panel-2:#161616; --line:#2e2e2e; --line-2:#4d4d4d;
  --fg:#fff; --muted:#c8c8c8; --faint:#909090; --strong:#fff; --accent:#ffe9a8; --link:#7fd0ff;
  --stage:#000;
  --r-evidence:#4dff88; --r-tension:#ff3d86; --r-method:#4db2ff; --r-context:#ffe14d; --r-structure:#d0d6e4;
  --link-rest:rgba(255,255,255,.32); --link-faint:rgba(255,255,255,.15); --link-dim:rgba(255,255,255,.04);
  --lbl-bg:rgba(0,0,0,.88); --lbl-line:rgba(255,255,255,.3); --lbl-fg:#fff;
  --primary-bg:#fff; --primary-fg:#000; --tip-bg:rgba(0,0,0,.97);
  --emissive:.3; --dim:.1; --halo:1;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.55 var(--f-body);overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--link)}
.gl{width:14px;height:14px;flex:none;fill:currentColor;stroke:currentColor;stroke-width:0}

#app{position:fixed;inset:0;display:grid;grid-template-rows:auto 1fr;grid-template-columns:minmax(0,1fr)}
/* top bar */
.bar{display:flex;align-items:center;gap:12px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:calc(10px + env(safe-area-inset-top,0px));border-bottom:1px solid var(--line);background:var(--bg-2);position:relative;z-index:30}
.brand{display:flex;flex-direction:column;line-height:1.1;min-width:0;max-width:34vw}
.brand b{font:700 17px/1.1 var(--f-brand);letter-spacing:1.6px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand span{font:11px/1.3 var(--f-label);color:var(--muted);letter-spacing:.4px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.search{position:relative;flex:1;max-width:420px;min-width:0}
.search input,.pathpick input{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 12px;outline:none}
.search input:focus,.pathpick input:focus{border-color:var(--line-2)}
.results{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--panel);border:1px solid var(--line-2);border-radius:10px;max-height:60vh;overflow:auto;box-shadow:0 18px 40px rgba(0,0,0,.35);z-index:40}
.results button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;padding:8px 12px;border-bottom:1px solid var(--line)}
.results button:hover,.results button.on{background:var(--panel-2)}
.results small{color:var(--muted);font:11px var(--f-label);margin-left:auto;white-space:nowrap}
.tools{display:flex;gap:8px;margin-left:auto;position:relative}
.btn{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 11px;font:500 13px var(--f-display);letter-spacing:.2px;white-space:nowrap}
.btn:hover{border-color:var(--line-2);background:var(--panel-2)}
.btn[aria-pressed="true"],.btn[aria-expanded="true"]{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--primary-bg);color:var(--primary-fg);border-color:var(--primary-bg);font-weight:600}
.btn.primary:hover{filter:brightness(1.06)}
.btn.small{padding:4px 9px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* view popover */
.pop{position:absolute;top:calc(100% + 8px);right:0;width:min(320px,calc(100vw - 32px));max-height:calc(100dvh - 90px);overflow:auto;background:var(--panel);border:1px solid var(--line-2);border-radius:12px;padding:14px;box-shadow:0 18px 50px rgba(0,0,0,.4);z-index:45;display:flex;flex-direction:column;gap:14px}
.pop .cap,.legend .cap{font:10.5px var(--f-label);letter-spacing:.7px;text-transform:uppercase;color:var(--faint);margin-bottom:6px}
.swatches{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.swatches button{display:flex;flex-direction:column;gap:6px;align-items:stretch;background:none;border:1px solid var(--line);border-radius:10px;padding:6px;font-size:12.5px;text-align:center}
.swatches button[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.sw{height:38px;border-radius:6px;position:relative;display:flex;align-items:center;justify-content:center;gap:5px;border:1px solid rgba(128,128,128,.25)}
.sw i{width:8px;height:8px;border-radius:50%}
.sw.night{background:radial-gradient(1px 1px at 18% 30%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 72% 22%,#cfe0ff 50%,transparent 51%),radial-gradient(1.4px 1.4px at 86% 70%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 34% 78%,#ffe9c7 50%,transparent 51%),radial-gradient(80% 70% at 30% 40%,rgba(122,86,216,.35),transparent 70%),radial-gradient(120% 95% at 50% 38%,#0e1636,#03050c)}
.sw.paper{background:radial-gradient(120% 95% at 50% 38%,#fffefa,#e4ddcd)}
.sw.contrast{background:#000}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{flex:1;background:none;border:0;border-right:1px solid var(--line);padding:6px 8px;font-size:13px}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--panel-2);color:var(--strong);box-shadow:inset 0 -2px 0 var(--accent)}
.check{display:flex;gap:9px;align-items:center;font-size:13px;padding:3px 0;cursor:pointer}
.check input{accent-color:var(--accent);width:15px;height:15px;margin:0}

/* stage */
#stage{position:relative;min-height:0;background:var(--stage);overflow:hidden}
#graph,#labels{position:absolute;top:0;left:0;bottom:0;right:0}
#labels{pointer-events:none;overflow:hidden}
@media (min-width:761px){ #stage.docked #graph, #stage.docked #labels{right:var(--panel-w)} }
.lbl{position:absolute;left:0;top:0;white-space:nowrap;font:500 11.5px/1.25 var(--f-body);color:var(--lbl-fg);background:var(--lbl-bg);border:1px solid var(--lbl-line);padding:2px 7px 2px 6px;border-radius:6px;display:flex;align-items:center;gap:5px;will-change:transform}
.lbl i{width:7px;height:7px;border-radius:2px;flex:none}
.lbl.hub{font:600 13.5px/1.2 var(--f-display);letter-spacing:.6px;text-transform:uppercase;padding:3px 9px;border-color:currentColor}
.lbl.axis{font:600 14px/1.2 var(--f-display);letter-spacing:.6px;text-transform:uppercase;color:var(--strong);max-width:340px;overflow:hidden;text-overflow:ellipsis}
.lbl.dim{opacity:.42}
.lbl.sel{box-shadow:0 0 0 1.5px var(--fg)}
.elbl{position:absolute;left:0;top:0;white-space:nowrap;font:500 10.5px/1.2 var(--f-label);color:var(--c);background:var(--lbl-bg);border:1px solid var(--c);padding:1px 6px;border-radius:999px;will-change:transform}
.float-tooltip-kap,.scene-tooltip{font:13px/1.45 var(--f-body)!important;max-width:320px;white-space:normal!important;background:var(--tip-bg)!important;border:1px solid var(--line-2);border-radius:9px;padding:9px 11px!important;color:var(--fg)!important;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.tt-rel{font:500 11px var(--f-label);letter-spacing:.4px;text-transform:uppercase;margin-bottom:3px}
.tt-note{color:var(--muted);margin-top:5px}
.tt-hint{color:var(--faint);font:11px var(--f-label);margin-top:6px}
.hint{position:absolute;left:max(16px,env(safe-area-inset-left,0px));top:12px;font:12px var(--f-label);color:var(--faint);pointer-events:none;z-index:5}

/* legend */
.legend{position:absolute;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:10;background:color-mix(in srgb,var(--panel) 88%,transparent);border:1px solid var(--line);border-radius:12px;max-width:min(620px,calc(100% - 32px));backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.lg-head{display:flex;align-items:center;gap:8px;width:100%;background:none;border:0;padding:8px 12px;font:10.5px var(--f-label);letter-spacing:.7px;text-transform:uppercase;color:var(--muted);text-align:left}
.lg-head::after{content:"▾";margin-left:auto;transition:transform .2s}
.legend[data-open="false"] .lg-head::after{transform:rotate(-90deg)}
.legend[data-open="false"] .lg-body{display:none}
.lg-body{padding:0 12px 12px;display:flex;flex-direction:column;gap:9px;max-height:46vh;overflow:auto}
.row{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--panel-2);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12px;color:var(--fg)}
.chip[aria-pressed="false"]{opacity:.4}
.chip small{color:var(--faint);font:11px var(--f-mono)}
.chip .gl{color:var(--muted)}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.ln{width:18px;height:3px;border-radius:2px;flex:none;background:var(--c);position:relative}
.ln::after{content:"";position:absolute;right:-3px;top:-3px;border:4.5px solid transparent;border-left:6px solid var(--c);border-right:0}

/* side panel */
/* navigation: jump-to chips (top right) and, in 2D, a minimap (bottom right) */
.jump{position:absolute;top:10px;right:max(16px,env(safe-area-inset-right,0px));z-index:10;display:flex;gap:2px;flex-wrap:nowrap;overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:none;max-width:calc(100% - 32px);background:color-mix(in srgb,var(--panel) 86%,transparent);border:1px solid var(--line);border-radius:999px;padding:3px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.jump button{background:none;border:0;border-radius:999px;padding:5px 10px;font:500 11px/1.2 var(--f-label);letter-spacing:.6px;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.jump button i{width:8px;height:8px;border-radius:50%;flex:none}
.jump button span{max-width:13em;overflow:hidden;text-overflow:ellipsis}
.jump::-webkit-scrollbar{display:none}   /* many sources: one row that scrolls sideways */
.jump button:hover,.jump button:focus-visible{background:var(--panel-2);color:var(--strong)}
.minimap{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:10;width:220px;height:160px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:color-mix(in srgb,var(--panel) 86%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);cursor:crosshair;touch-action:none}
.minimap canvas{display:block;width:100%;height:100%}
.minimap .cap{position:absolute;left:9px;top:6px;font:10px var(--f-label);letter-spacing:.7px;text-transform:uppercase;color:var(--faint);pointer-events:none}
#stage.mm .legend{max-width:min(620px,calc(100% - 280px))}
@media (min-width:761px){
  #stage.docked .jump,#stage.docked .minimap{right:calc(var(--panel-w) + 16px)}
  #stage.docked.mm .legend{max-width:min(620px,calc(100% - var(--panel-w) - 280px))}
}
.pop .sub{font-size:12px;color:var(--faint);margin-top:7px;line-height:1.45}
.linkbtn{background:none;border:0;padding:0;font:inherit;color:var(--accent);text-decoration:underline;text-underline-offset:2px;cursor:pointer}
.panel{position:absolute;top:0;right:0;bottom:0;width:var(--panel-w);background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;z-index:15;transform:translateX(100%);transition:transform .28s ease}
.panel.open{transform:none}
.panel-head{padding:16px 20px 12px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.panel-head .meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tag{font:11px/1 var(--f-label);letter-spacing:.4px;text-transform:uppercase;border:1px solid var(--line-2);border-radius:5px;padding:4px 6px;color:var(--muted);display:inline-flex;gap:5px;align-items:center}
.tag.grp{color:var(--bg);border-color:transparent}
.panel-head h2{margin:0;font:600 21px/1.25 var(--f-display);letter-spacing:-.1px;text-wrap:balance}
.panel-head h2 .v{font:500 13px var(--f-label);color:var(--c);white-space:nowrap}
.panel-head .short{margin:0;color:var(--muted)}
.close{margin-left:auto;background:none;border:1px solid var(--line);border-radius:7px;padding:3px 9px;color:var(--muted)}
.back{background:none;border:1px solid var(--line);border-radius:7px;padding:3px 9px;color:var(--muted)}
.panel-body{overflow:auto;padding:14px 20px 28px;display:flex;flex-direction:column;gap:20px;min-height:0}
.md{max-width:62ch;font-family:var(--f-read)}
.md h3{font:600 15.5px/1.3 var(--f-display);margin:18px 0 6px;color:var(--accent)}
.md h3:first-child{margin-top:0}
.md h4{font:600 14px/1.3 var(--f-body);margin:14px 0 4px}
.md p{margin:0 0 9px}
.md ul,.md ol{margin:0 0 9px;padding-left:20px}
.md li{margin:2px 0}
.md code{font:12.5px var(--f-mono);background:var(--panel-2);border:1px solid var(--line);border-radius:4px;padding:0 4px}
.md strong{color:var(--strong)}
.md .tbl{overflow-x:auto;margin:6px 0 12px;border:1px solid var(--line);border-radius:8px}
.md table{border-collapse:collapse;font-size:12.5px;min-width:100%;font-variant-numeric:tabular-nums}
.md th,.md td{padding:6px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.md th{background:var(--panel-2);font-weight:600}
.md mjx-container[display="true"]{overflow-x:auto;overflow-y:hidden;padding:4px 0;margin:8px 0!important}
.md mjx-container{color:var(--fg)}
/* figures inside notes, written as ![caption](fig:<id>) */
.md figure.mdfig{margin:8px 0 14px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg-2)}
.md figure.mdfig button{display:block;width:100%;padding:0;border:0;background:#fff;cursor:zoom-in}
.md figure.mdfig img{display:block;width:100%;height:auto;max-height:340px;object-fit:contain;background:#fff}
.md figure.mdfig figcaption{padding:7px 10px;font-size:12.5px;color:var(--muted);line-height:1.4}
.md figure.mdfig figcaption small{font:11px var(--f-mono);color:var(--faint);margin-left:6px}
.md .figref{background:none;border:0;padding:0;color:var(--link);text-decoration:underline dotted;cursor:zoom-in;font:inherit}
.md .figmiss{color:var(--faint);font-style:italic}
/* figure strip at the top of a node */
.figs{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 8px;scroll-snap-type:x proximity}
.figs .fig{flex:none;width:148px;display:flex;flex-direction:column;gap:5px;background:var(--bg-2);border:1px solid var(--line);border-radius:10px;padding:6px;text-align:left;scroll-snap-align:start;cursor:zoom-in}
.figs .fig:hover{border-color:var(--line-2)}
.figs .fig .im{height:96px;border-radius:6px;background:#fff center/contain no-repeat;display:flex;align-items:center;justify-content:center;overflow:hidden}
.figs .fig img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.figs .fig .cap{font-size:11.5px;line-height:1.35;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.figs .fig .pg{font:10.5px var(--f-mono);color:var(--faint)}
.sec-title{font:10.5px var(--f-label);letter-spacing:.7px;text-transform:uppercase;color:var(--faint);margin:0 0 8px;display:flex;align-items:center;gap:8px}
.sec-title .btn{margin-left:auto;text-transform:none;letter-spacing:0;font-family:var(--f-body)}
/* links of a node, grouped by relation family */
.lgroup{border-top:1px solid var(--line);padding:6px 0 2px}
.lgroup summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:9px;font:10.5px var(--f-label);letter-spacing:.6px;text-transform:uppercase;color:var(--muted);padding:5px 2px}
.lgroup summary::-webkit-details-marker{display:none}
.lgroup summary::after{content:"▾";margin-left:auto}
.lgroup:not([open]) summary::after{transform:rotate(-90deg)}
.lrow{display:grid;grid-template-columns:1fr auto;gap:3px 8px;padding:7px 6px;border-radius:8px}
.lrow:hover,.lrow.on{background:var(--panel-2)}
.lmain{display:flex;gap:8px;align-items:baseline;text-align:left;background:none;border:0;padding:0;min-width:0}
.lmain .rel{font:11px/1.4 var(--f-label);color:var(--c);flex:none;width:104px}
.lmain .t{font-weight:500}
.lmain .dot{align-self:center}
.linfo{background:none;border:1px solid var(--line);border-radius:6px;font:11px var(--f-label);color:var(--muted);padding:2px 7px;align-self:start;white-space:nowrap}
.linfo:hover{border-color:var(--c);color:var(--c)}
.lnote{grid-column:1/-1;font-size:12.5px;color:var(--muted);padding-left:112px;line-height:1.45}
.lnote p{margin:0}
.badge{font:10px var(--f-label);border:1px solid var(--line-2);border-radius:4px;padding:0 4px;color:var(--faint);margin-left:6px}
.pathpick{position:relative;margin:4px 0 10px}
.pathpick .results{max-height:44vh}
/* link card */
.lcard .end{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg-2)}
.lcard .end .cap{font:10.5px var(--f-label);letter-spacing:.6px;text-transform:uppercase;color:var(--faint);display:flex;gap:6px;align-items:center}
.lcard .end button{background:none;border:0;padding:0;margin-top:3px;font:600 16px/1.25 var(--f-display);text-align:left;color:var(--fg)}
.lcard .end button:hover{text-decoration:underline}
.lcard .end p{margin:4px 0 0;color:var(--muted);font-size:13px}

/* path finder: cheapest chain, preferring content relations over "part of" and not routing through planets */
function findPath(a, b) {
  const dist = new Map([[a.id, 0]]), prev = new Map(), done = new Set();
  const step = (l, to) => (l.rel === "part_of" ? 3 : l.rel === "frames" ? 2.2 : l.rel === "cites" ? 1.4 : 1) + ((to.type === "hub" || to.type === "axis") && to !== b ? 2.5 : 0);
  while (true) {
    let u = null, best = Infinity;
    for (const [id, d] of dist) if (!done.has(id) && d < best) { best = d; u = id; }
    if (u === null) return null;
    if (u === b.id) break;
    done.add(u);
    for (const l of incident(u)) {
      const v = sid(l) === u ? tid(l) : sid(l);
      if (done.has(v)) continue;
      const nd = best + step(l, byId.get(v));
      if (nd < (dist.get(v) ?? Infinity)) { dist.set(v, nd); prev.set(v, { u, l }); }
    }
  }
  const ids = [b.id], ls = [];
  let x = b.id;
  while (x !== a.id) { const p = prev.get(x); ls.unshift(p.l); ids.unshift(p.u); x = p.u; }
  return { nodes: ids, links: ls, set: new Set(ids), linkSet: new Set(ls) };
}

}
